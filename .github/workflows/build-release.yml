---
name: Build Release

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet publish -c Release --runtime win-x64 --output ./publish

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Locker-Release
          path: ./publish/Locker.exe
          if-no-files-found: error
